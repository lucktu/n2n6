# renewsn.conf - Configuration for renewsn.sh (shell version)
#
# Edit this file and place it at /etc/renewsn.conf or in the same directory as renewsn.sh

# Probe interval in seconds
INTERVAL=30

# Probe timeout in seconds
PROBE_TIMEOUT=3

# Consecutive probe failures before switching away from the SN currently in use.
# A single transient miss does NOT trigger a switch.
FAIL_THRESHOLD=3

# Probe method. Default "udp": n2n supernodes are UDP services, the
# REGISTER_SUPER business-layer check is what truly tells good from bad.
#   udp  = UDP REGISTER_SUPER reply (default, most accurate for n2n SN)
#   tcp  = TCP port alive only (useful when the SN sits behind a TCP tunnel)
#   both = both checks must pass (most strict)
PROBE_METHOD="udp"

# n2n community name used for the UDP REGISTER_SUPER business-layer probe
# Must match the community your edge actually uses, or the SN gives no reply
# and is judged dead.
COMMUNITY="n2n"

# Candidate supernodes (space-separated list of host:port).
# Priority follows list order: the first healthy candidate is always chosen.
# Set your preferred (primary) SN as the first entry so it is used when
# available, with subsequent entries serving as fallback.
CANDIDATES="1.2.3.4:10084 5.6.7.8:10087 9.10.11.12:10091"

# DNSPod API token (https://console.dnspod.cn/account/token)
# Format: token_id,token_value
DNS_TOKEN="12345,abcdef1234567890abcdef1234567890"

# Root domain
DNS_DOMAIN="ouno.eu.org"

# Sub domain
DNS_SUB_DOMAIN="n2n6"

# TXT record TTL in seconds (DNSPod free tier minimum is 600)
DNS_TTL=600

# Enable syslog logging (1=enabled, 0=disabled)
LOG_ENABLED=1