[sn-watch]
# Probe interval in seconds
interval = 30
# Probe timeout in seconds
probe_timeout = 3
# Probe method: udp (default) | tcp | both
# udp: REGISTER_SUPER business-layer check (most accurate for n2n SN)
# tcp: TCP port alive only
# both: both checks must pass
probe_method = udp
# Sliding window size (last N probes)
window_size = 5
# Fail threshold (health percentage below this is unhealthy)
fail_threshold = 50
# n2n community name for UDP business-layer probe
community = n2n

[supernodes]
# Candidate supernodes (one per line: name=host:port).
# HTTP redirect URLs are also supported: name=http://example.com/path
# Priority follows list order: the first healthy candidate is always chosen.
# Set your preferred (primary) SN as the first entry, with subsequent entries
# serving as fallback.
sn1 = 1.2.3.4:10084
sn2 = 5.6.7.8:10087
sn3 = 9.10.11.12:10091

[dnspod]
# DNSPod API token (https://console.dnspod.cn/account/token)
# Format: token_id,token_value
token = 12345,abcdef1234567890abcdef1234567890
# Root domain
domain = ouno.eu.org
# Sub domain
sub_domain = n2n6
# TXT record TTL in seconds (DNSPod free tier minimum is 600)
record_ttl = 600

[log]
# Log level: DEBUG | INFO | WARNING | ERROR
level = INFO
# Log file path (empty for stdout)
file = renewsn.log
# Max log lines to keep (0 = unlimited)
max_log_entries = 1000